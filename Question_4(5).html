<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function validate(){
            var technology = document.getElementById("tname").value;
            if (tech == ""){
                alert("Please Enter Valid Technology Name.");
                return false;
            }
            alert("Submitted Successfully!");
            return true;
        }
    </script>
</head>
<body>
    <form onsubmit="return validate()">
        <h2>Validate Form</h2>
        <br>
        <label>Enter a Technology Name.</label>
        <input type="text" id="tname"><br>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
